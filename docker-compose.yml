version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: daftar
      POSTGRES_PASSWORD: daftar_dev_password
      POSTGRES_DB: daftar_dev
    ports:
      - "5432:5432"
    volumes:
      - daftar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daftar -d daftar_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  daftar_postgres_data:
