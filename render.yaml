databases:
  - name: daftar-db
    databaseName: daftar
    user: daftar
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: daftar-api
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    # No `corepack enable` here: Render's Node build image already ships a
    # working pnpm binary, and corepack tries to relink it in a read-only
    # location on that image, which fails the build.
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @daftar/shared run build && pnpm --filter @daftar/api run build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: daftar-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # Set these to your real deployed URLs after the first deploy
      # (Render assigns the service's *.onrender.com URL on creation).
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      # Leave unset unless the frontend and API share a root domain
      # (e.g. example.com + api.example.com) — see apps/api/src/auth/cookies.ts.
      - key: COOKIE_DOMAIN
        sync: false
      - key: STORAGE_PROVIDER
        value: s3
      - key: STORAGE_S3_ENDPOINT
        sync: false
      - key: STORAGE_S3_REGION
        value: auto
      - key: STORAGE_S3_BUCKET
        sync: false
      - key: STORAGE_S3_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_S3_FORCE_PATH_STYLE
        value: "false"
      - key: STORAGE_PUBLIC_BASE_URL
        sync: false
      - key: PAYMENT_PROVIDER
        value: mock
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_PROVIDER
        value: console
      - key: EMAIL_FROM
        value: no-reply@daftar.app
