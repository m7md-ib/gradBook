# daftar-db is Render's free Postgres, which expires 30 days after creation.
# The data now lives in Supabase (DATABASE_URL below); this entry only keeps
# the old database around for the one-off copy (OLD_DATABASE_URL). Delete it
# here and in the Render dashboard once the copy is done.
databases:
  - name: daftar-db
    databaseName: daftar
    user: daftar
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: daftar-api
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    # No `corepack enable` here: Render's Node build image already ships a
    # working pnpm binary, and corepack tries to relink it in a read-only
    # location on that image, which fails the build.
    #
    # NODE_ENV=development for just the install step: with NODE_ENV=production
    # (set below, needed at runtime) pnpm skips devDependencies, but the build
    # step (tsc) needs typescript/vitest/@types/* to type-check the project —
    # the compiled output that actually ships doesn't include any of them.
    buildCommand: NODE_ENV=development pnpm install --frozen-lockfile && pnpm --filter @daftar/shared run build && pnpm --filter @daftar/api run build
    # Runs migrations before every boot (including restarts/redeploys) since
    # the Free plan has no Shell to run them by hand. Safe to repeat: Drizzle
    # tracks applied migrations and only runs new ones.
    #
    # seed.js already completed successfully in an earlier deploy — do NOT
    # chain it back in here. Re-running it against an already-seeded DB fails
    # on duplicate keys (unique slugs) and would take the service down on
    # every future boot.
    #
    # Both scripts below are permanent, idempotent self-checks, cheap and
    # safe to run on every boot (they're one or two indexed SELECTs and a
    # no-op once already applied) — never remove them, each guards against
    # a real failure mode that can recur:
    # - promote-owner-admin.js: makes the accounts in ADMIN_EMAIL admins
    #   (creating one from ADMIN_PASSWORD if missing), demotes every other
    #   admin, and blocks the public demo admin account whose password is in
    #   the README. No addresses live in the repo — only in these env vars.
    # - fix-demo-notebook.js: does nothing unless SEED_DEMO_NOTEBOOK=true
    #   (the landing page shows a static example now). When enabled, it
    #   reseeds the public showcase notebook
    #   (sara-2026) only if it's missing or stuck mid-creation (status !=
    #   'active') — e.g. a storage upload failing partway through
    #   seedDemoNotebook, which a cold start's network warm-up makes more
    #   likely. It must stay a no-op on a healthy boot: it used to
    #   unconditionally delete-and-recreate the demo notebook every single
    #   boot, which is what caused that exact failure mode in the first
    #   place.
    startCommand: node apps/api/dist/db/migrate.js && node apps/api/dist/db/promote-owner-admin.js && node apps/api/dist/db/fix-demo-notebook.js && node apps/api/dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Supabase's "Session pooler" connection string (Connect → Session
      # pooler). Not the "Direct connection": that one is IPv6-only, which
      # Render can't reach. Not the "Transaction pooler" either.
      - key: DATABASE_URL
        sync: false
      # One-off move: the old database's URL. On the next boot everything in
      # it is copied into DATABASE_URL, as long as that one has no accounts
      # yet (see apps/api/src/db/copy-database.ts). Remove it afterwards.
      - key: OLD_DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # Set these to your real deployed URLs after the first deploy
      # (Render assigns the service's *.onrender.com URL on creation).
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      # Leave unset unless the frontend and API share a root domain
      # (e.g. example.com + api.example.com) — see apps/api/src/auth/cookies.ts.
      - key: COOKIE_DOMAIN
        sync: false
      - key: STORAGE_PROVIDER
        value: s3
      - key: STORAGE_S3_ENDPOINT
        sync: false
      - key: STORAGE_S3_REGION
        value: auto
      - key: STORAGE_S3_BUCKET
        sync: false
      - key: STORAGE_S3_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_S3_SECRET_ACCESS_KEY
        sync: false
      # Supabase Storage's S3-compatible endpoint requires path-style
      # addressing (bucket in the URL path, not as a subdomain) — the
      # virtual-hosted-style requests this defaults to fail TLS handshake
      # against it. Set to "false" instead if you switch to AWS S3 or R2.
      - key: STORAGE_S3_FORCE_PATH_STYLE
        value: "true"
      - key: STORAGE_PUBLIC_BASE_URL
        sync: false
      # CliQ / bank transfer, confirmed by an admin in Admin → Orders (Stripe
      # doesn't onboard Jordanian merchants). "mock" is refused in production.
      - key: PAYMENT_PROVIDER
        value: manual
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Who is admin. Comma-separated; any other admin is demoted on boot.
      - key: ADMIN_EMAIL
        sync: false
      # Optional: creates the admin account if it doesn't exist yet, or resets
      # its password. Remove it once you've signed in.
      - key: ADMIN_PASSWORD
        sync: false
      # One-off and destructive: a value starting with "delete-all-users"
      # wipes every account and its data on the next boot (once per value).
      # Remove it afterwards.
      - key: RESET_ALL_DATA
        sync: false
      - key: EMAIL_PROVIDER
        value: console
      - key: EMAIL_FROM
        value: no-reply@daftar.app
