# The API runs on Render's free plan, which sleeps after ~15 minutes without
# traffic; the first visitor after that waits up to a minute. Supabase's free
# plan also pauses a project after a week without database activity.
# Pinging an endpoint that reads the database every 10 minutes keeps both
# awake. Free: scheduled workflows don't cost minutes on a public repository.
# Note: GitHub disables scheduled workflows after 60 days with no commits.
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping the API (reads the database)
        run: |
          for attempt in 1 2 3; do
            if curl -fsS --max-time 90 -o /dev/null https://daftar-api-auel.onrender.com/api/catalog/packages; then
              echo "API is awake"
              exit 0
            fi
            echo "attempt $attempt failed, retrying"
            sleep 15
          done
          echo "API did not answer"
          exit 1
