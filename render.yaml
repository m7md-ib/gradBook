databases:
  - name: daftar-db
    databaseName: daftar
    user: daftar
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: daftar-api
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    # No `corepack enable` here: Render's Node build image already ships a
    # working pnpm binary, and corepack tries to relink it in a read-only
    # location on that image, which fails the build.
    #
    # NODE_ENV=development for just the install step: with NODE_ENV=production
    # (set below, needed at runtime) pnpm skips devDependencies, but the build
    # step (tsc) needs typescript/vitest/@types/* to type-check the project —
    # the compiled output that actually ships doesn't include any of them.
    buildCommand: NODE_ENV=development pnpm install --frozen-lockfile && pnpm --filter @daftar/shared run build && pnpm --filter @daftar/api run build
    # Runs migrations before every boot (including restarts/redeploys) since
    # the Free plan has no Shell to run them by hand. Safe to repeat: Drizzle
    # tracks applied migrations and only runs new ones.
    #
    # seed.js already completed successfully in an earlier deploy — do NOT
    # chain it back in here. Re-running it against an already-seeded DB fails
    # on duplicate keys (unique slugs) and would take the service down on
    # every future boot.
    #
    # TEMPORARY: both scripts below are one-off, idempotent, and never fail
    # the boot (they log and continue/skip if there's nothing to do). Safe to
    # leave in for a few boots, but remove once confirmed applied — no reason
    # to run no-op checks on every restart forever.
    # - promote-owner-admin.js: promotes the owner's own account (signed up
    #   normally, password never shared with anyone) to admin, and blocks
    #   the public demo admin account whose password is in the README.
    # - fix-demo-notebook.js: an earlier seed run left the demo notebook
    #   (sara-2026) stuck mid-creation (status='draft', so the public API
    #   404s it) after a storage TLS failure, since fixed — seedDemoNotebook
    #   skips if the row already exists, so a normal reseed can never finish
    #   it. Deletes the stuck demo user (cascades to the notebook and
    #   everything under it) and recreates it from scratch.
    startCommand: node apps/api/dist/db/migrate.js && node apps/api/dist/db/promote-owner-admin.js && node apps/api/dist/db/fix-demo-notebook.js && node apps/api/dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: daftar-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # Set these to your real deployed URLs after the first deploy
      # (Render assigns the service's *.onrender.com URL on creation).
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      # Leave unset unless the frontend and API share a root domain
      # (e.g. example.com + api.example.com) — see apps/api/src/auth/cookies.ts.
      - key: COOKIE_DOMAIN
        sync: false
      - key: STORAGE_PROVIDER
        value: s3
      - key: STORAGE_S3_ENDPOINT
        sync: false
      - key: STORAGE_S3_REGION
        value: auto
      - key: STORAGE_S3_BUCKET
        sync: false
      - key: STORAGE_S3_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_S3_SECRET_ACCESS_KEY
        sync: false
      # Supabase Storage's S3-compatible endpoint requires path-style
      # addressing (bucket in the URL path, not as a subdomain) — the
      # virtual-hosted-style requests this defaults to fail TLS handshake
      # against it. Set to "false" instead if you switch to AWS S3 or R2.
      - key: STORAGE_S3_FORCE_PATH_STYLE
        value: "true"
      - key: STORAGE_PUBLIC_BASE_URL
        sync: false
      - key: PAYMENT_PROVIDER
        value: mock
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_PROVIDER
        value: console
      - key: EMAIL_FROM
        value: no-reply@daftar.app
